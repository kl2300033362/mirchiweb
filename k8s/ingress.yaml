apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: music-app-ingress
  namespace: default
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  ingressClassName: nginx
  rules:
  - host: music-app.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: music-frontend-service
            port:
              number: 80
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: music-api-service
            port:
              number: 8000
